directories:
  output: release
  buildResources: build
appId: com.ghousia.chickenkhata
productName: Ghousia Chicken Khata
files:
  - filter:
      - dist/**/*
      - package.json
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  allowToChangeInstallationDirectory: false
electronVersion: 43.3.0
