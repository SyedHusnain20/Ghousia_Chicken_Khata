name: Build Windows Installer

# Runs automatically whenever main is updated, and can also be triggered
# manually from the Actions tab (Run workflow button) whenever you just
# want a fresh installer without pushing new code.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    # GitHub's own Windows runner - comes with the MSVC C++ toolchain and
    # Python already installed, so better-sqlite3's native build step just
    # works here with no setup, unlike a bare local machine.
    runs-on: windows-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # npm install rather than npm ci: npm ci demands package.json and
        # package-lock.json match exactly and fails hard otherwise. If the
        # lock file ever drifts out of sync locally (e.g. package.json's
        # electron version was changed without re-running npm install
        # locally to update the lock file), npm install just resolves and
        # updates it instead of refusing to proceed - more forgiving for a
        # small solo project like this one.
        run: npm install

      - name: Build the installer
        run: npm run pack

      # The .exe electron-builder produces (see package.json's
      # "directories.output": "release") is uploaded here so it can be
      # downloaded from this workflow run's summary page - no local build
      # environment required at all.
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
